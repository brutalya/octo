name: Release
# A merge to main that changes the app version publishes release v<version> with the Windows,
# Linux and Android builds. A failed run leaves only a draft; re-run it (or "Run workflow").
on:
  push:
    branches: [main]
    paths:
      - 'crates/octo-desktop/tauri.conf.json'
      - 'crates/octo-desktop/Cargo.toml'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
      release_id: ${{ steps.draft.outputs.id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v=$(jq -r .version crates/octo-desktop/tauri.conf.json)
          c=$(grep -m1 '^version' crates/octo-desktop/Cargo.toml | cut -d'"' -f2)
          if [ "$v" != "$c" ]; then
            echo "::error::version mismatch: tauri.conf.json $v, Cargo.toml $c"
            exit 1
          fi
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            echo "v$v is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - id: draft
        if: steps.v.outputs.release == 'true'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          # A draft left by a failed run has no tag yet: replace it.
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          # The id comes from the create response: a listing right after creation may not show it yet.
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="Octo $TAG" \
            -F draft=true -F generate_release_notes=true --jq .id)
          if [ -z "$id" ]; then
            echo "::error::draft release was not created"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      OCTO_UPDATER_PUBKEY: ${{ vars.OCTO_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Tauri Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev build-essential pkg-config
      - name: Build web
        working-directory: web
        run: npm ci && npm run build
      - name: Updater artifacts (only when a signing key is configured)
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$OCTO_UPDATER_PUBKEY" ]; then
            echo 'TAURI_ARGS=--bundles ${{ matrix.bundles }} --config {"bundle":{"createUpdaterArtifacts":true}}' >> "$GITHUB_ENV"
          else
            echo 'TAURI_ARGS=--bundles ${{ matrix.bundles }}' >> "$GITHUB_ENV"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: crates/octo-desktop
          releaseId: ${{ needs.version.outputs.release_id }}
          tagName: ${{ needs.version.outputs.tag }}
          includeUpdaterJson: true
          args: ${{ env.TAURI_ARGS }}

  android:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/android.yml
    with:
      release_tag: ${{ needs.version.outputs.tag }}

  publish:
    needs: [version, desktop, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      # Tags created with GITHUB_TOKEN trigger no workflows; start the versioned Docker build.
      - run: gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"

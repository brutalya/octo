name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      OCTO_UPDATER_PUBKEY: ${{ vars.OCTO_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Tauri Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev build-essential pkg-config
      - name: Build web
        working-directory: web
        run: npm ci && npm run build
      - name: Updater artifacts (only when a signing key is configured)
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$OCTO_UPDATER_PUBKEY" ]; then
            echo 'TAURI_ARGS=--bundles ${{ matrix.bundles }} --config {"bundle":{"createUpdaterArtifacts":true}}' >> "$GITHUB_ENV"
          else
            echo 'TAURI_ARGS=--bundles ${{ matrix.bundles }}' >> "$GITHUB_ENV"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/octo-desktop
          tagName: ${{ github.ref_name }}
          releaseName: Octo ${{ github.ref_name }}
          releaseDraft: true
          uploadUpdaterJson: true
          args: ${{ env.TAURI_ARGS }}

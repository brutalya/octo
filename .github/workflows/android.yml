name: Android
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools # the default also installs 'tools', which no longer exists
      - name: NDK
        run: |
          sdkmanager "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web
        working-directory: web
        run: npm ci && npm run build
      - run: cargo install tauri-cli --version "^2" --locked
      # gen/android is not committed (gitignored); it is generated here.
      - name: Generate Android project
        working-directory: crates/octo-desktop
        run: cargo tauri android init --ci
      # Debug build: debug-signed APK, installable without a keystore, and the
      # debug manifest allows cleartext HTTP to the loopback server.
      # Release signing (later): repo secrets ANDROID_KEYSTORE_BASE64,
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      - name: Build APK
        working-directory: crates/octo-desktop
        run: cargo tauri android build --debug --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: octo-android-apk
          path: crates/octo-desktop/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

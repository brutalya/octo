name: Android
on:
  workflow_dispatch:
  # Called by release.yml, which passes the tag of the draft release to upload to.
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools # the default also installs 'tools', which no longer exists
      - name: NDK
        run: |
          sdkmanager "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web
        working-directory: web
        run: npm ci && npm run build
      - run: cargo install tauri-cli --version "^2" --locked
      # gen/android is not committed (gitignored); it is generated here.
      - name: Generate Android project
        working-directory: crates/octo-desktop
        run: cargo tauri android init --ci
      # Our MainActivity pads the WebView by system bars and keyboard (Android 15+ is edge to
      # edge). Fail if the generated file moved, rather than silently shipping without it.
      - name: Use our MainActivity
        working-directory: crates/octo-desktop
        run: |
          dst=gen/android/app/src/main/java/com/octo/app/MainActivity.kt
          test -f "$dst" || { echo "generated $dst not found"; find gen/android -name 'MainActivity*'; exit 1; }
          echo "--- generated:"; cat "$dst"
          cp android/MainActivity.kt "$dst"
      # Debug build (the debug manifest allows cleartext HTTP to the loopback server). Gradle would
      # sign it with a random debug key per run, and Android refuses to update over an APK signed
      # with another key. The repo secret holds one fixed keystore (alias androiddebugkey,
      # passwords android); the injected signing properties make Gradle sign with it.
      - name: Stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            if [ -n "$RELEASE_TAG" ]; then echo "::error::secret ANDROID_DEBUG_KEYSTORE_BASE64 is not set"; exit 1; fi
            echo "::warning::no ANDROID_DEBUG_KEYSTORE_BASE64: throwaway key, this APK will not update over others"
            exit 0
          fi
          props=crates/octo-desktop/gen/android/gradle.properties
          test -f "$props" || { echo "generated $props not found"; exit 1; }
          ks="$RUNNER_TEMP/octo.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
          printf '%s\n' \
            "android.injected.signing.store.file=$ks" \
            "android.injected.signing.store.password=android" \
            "android.injected.signing.key.alias=androiddebugkey" \
            "android.injected.signing.key.password=android" \
            >> "$props"
          sha=$(keytool -exportcert -keystore "$ks" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          echo "certificate SHA-256: $sha"
          echo "WANT_CERT_SHA256=$sha" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: crates/octo-desktop
        run: cargo tauri android build --debug --apk --target aarch64
      # Fail rather than ship an APK that cannot update over the installed one.
      - name: Check signing key
        if: env.WANT_CERT_SHA256 != ''
        run: |
          apk=$(find crates/octo-desktop/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)
          got=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "APK certificate SHA-256: $got"
          test "$got" = "$WANT_CERT_SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: octo-android-apk
          path: crates/octo-desktop/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Upload to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          apk=$(find crates/octo-desktop/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)
          cp "$apk" "octo-${TAG#v}-arm64-debug.apk"
          gh release upload "$TAG" "octo-${TAG#v}-arm64-debug.apk" --repo "$GITHUB_REPOSITORY" --clobber

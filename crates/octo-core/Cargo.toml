[package]
name = "octo-core"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
pdf-extract = "0.12"
blake2 = "0.11.0"
chacha20poly1305 = "0.11.0"
directories = "6.0.0"
url = "2"
zeroize = "1"
futures-util = "0.3.34"
which = "8"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
ts-rs = "12.0.1"
uuid = { version = "1.29.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"

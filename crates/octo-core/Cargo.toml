[package]
name = "octo-core"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
ts-rs = "12.0.1"
uuid = { version = "1.29.0", features = ["v4"] }

[package]
name = "octo-net"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
blake2 = "0.11.0"
data-encoding = "2.11.1"
futures-util = "0.3.34"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snow = "0.10.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
